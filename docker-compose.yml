# InnoQuest local development infrastructure.
# Only infrastructure (MySQL) lives here; app services deploy to Vercel/Render.
# Usage:
#   docker compose up -d        -> start MySQL
#   docker compose down         -> stop containers
#   docker compose down -v      -> stop and wipe volumes (destroys data)

services:
  mysql:
    image: mysql:8.0
    container_name: innoquest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-innoquest}
      MYSQL_USER: ${MYSQL_USER:-innoquest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-innoquest}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - innoquest

networks:
  innoquest:
    driver: bridge

volumes:
  mysql_data:
