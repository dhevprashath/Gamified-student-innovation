services:
  - type: web
    name: innoquest-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # set in Render dashboard: mysql+pymysql://USER:PASS@HOST:3306/DBNAME
      - key: AI_API_KEY
        sync: false   # set in Render dashboard
      - key: AI_PROVIDER
        value: gemini-native
      - key: AI_MODEL
        value: gemini-3.6-flash
